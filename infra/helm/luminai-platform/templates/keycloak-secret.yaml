# NOTE: Do not set a real password in values.yaml. Override this at deploy time,
# e.g. `helm upgrade --install luminai . --set keycloak.adminPassword=<real-value>`
# or via a separate, gitignored values-secrets.yaml file.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-keycloak-admin
  labels:
    {{- include "luminai-platform.labels" . | nindent 4 }}
    {{- include "luminai-platform.selectorLabels" "keycloak" | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ .Values.keycloak.adminPassword | default "changeme-at-deploy-time" | quote }}