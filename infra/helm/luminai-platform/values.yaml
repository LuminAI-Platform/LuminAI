coreBackend:
  replicaCount: 1
  image:
    repository: ghcr.io/luminai-platform/core-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  env:
    SPRING_PROFILES_ACTIVE: "prod"
    SERVER_PORT: "8080"
    SERVER_ADDRESS: "0.0.0.0"

dataEngine:
  replicaCount: 1
  image:
    repository: luminai/data-engine
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  env:
    KAFKA_BOOTSTRAP_SERVERS: "luminai-kafka:9092"
    POSTGRES_HOST: "luminai-postgres"
    POSTGRES_PORT: "5432"
    MINIO_ENDPOINT: "luminai-minio:9000"

keycloak:
  replicaCount: 1
  image:
    repository: quay.io/keycloak/keycloak
    pullPolicy: IfNotPresent
    tag: "24.0"
  service:
    type: ClusterIP
    port: 8180
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  env:
    KEYCLOAK_ADMIN: "admin"
    KC_HTTP_PORT: "8180"
  # DO NOT set a real password here. Override at deploy time via --set or a
  # separate, gitignored values-secrets.yaml file. See templates/keycloak-secret.yaml.
  adminPassword: ""
  args:
    - "start-dev"
    - "--import-realm"