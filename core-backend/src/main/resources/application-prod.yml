# ==============================================================================
# PRODUCTION PROFILE — Deployed on Render / Cloud
# ==============================================================================
# Activated via: SPRING_PROFILES_ACTIVE=prod (set on Render dashboard)
#
# All sensitive values are injected via environment variables.
# See API_key.example at the repo root for the full variable registry.
# ==============================================================================

spring:
  # ── DataSource — Neon PostgreSQL (pooled via PgBouncer) ────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: LuminaiHikariPool
      minimum-idle: 1
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000
      connection-test-query: SELECT 1

  # ── JPA / Hibernate ────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: none        # Flyway manages schema; validate fails with multi-tenant SCHEMA isolation
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        multiTenancy: SCHEMA
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        cache:
          use_second_level_cache: false
          use_query_cache: false
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
        generate_statistics: false

  # ── Flyway ─────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    schemas: public

  # ── Neo4j — graph database for resolved entities ──────────────────
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:neo4j}

  # ── Kafka — Aiven (SASL/SCRAM over TLS) ──────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: >-
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_USERNAME}"
        password="${KAFKA_PASSWORD}";
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        batch-size: 16384
        compression.type: snappy
        spring.json.add.type.headers: true
    consumer:
      group-id: luminai-core-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      max-poll-records: 50
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.Map
    listener:
      ack-mode: manual_immediate
      concurrency: 3
      observation-enabled: true
      auto-startup: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:${KAFKA_AUTO_STARTUP:true}}
    admin:
      auto-create: false
      properties:
        bootstrap.servers: ${KAFKA_BOOTSTRAP_SERVERS}

  # ── Redis — Upstash (TLS) ─────────────────────────────────────────
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:true}

  # ── Security — Keycloak OIDC (JWT validation) ──────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

# ── Server ─────────────────────────────────────────────────────────────
server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0
  shutdown: graceful

# ── Actuator ───────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    neo4j:
      enabled: false
    kafka:
      enabled: false
    redis:
      enabled: false

# ── Logging — production-level (no debug noise) ────────────────────────
logging:
  level:
    root: INFO
    com.luminai: INFO
    org.springframework.boot: INFO
    org.apache.catalina: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    com.zaxxer.hikari: INFO
    org.springframework.kafka: WARN

# ── Application custom properties ──────────────────────────────────────
luminai:
  multitenancy:
    schema-prefix: tenant_
    default-schema: public
    require-tenant: true
  vault:
    encryption-key: ${VAULT_ENCRYPTION_KEY}
  kafka:
    topic:
      partitions: 3
      replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL}
    realm: ${KEYCLOAK_REALM}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

# ── Data Engine (Python FastAPI on Render) ─────────────────────────────
data-engine:
  base-url: ${DATA_ENGINE_URL:http://localhost:8000}
  api-key: ${DATA_ENGINE_API_KEY:}

