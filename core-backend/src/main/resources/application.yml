spring:
  application:
    name: luminai-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
      file-size-threshold: 2MB

server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 500MB
    max-swallow-size: 500MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    neo4j:
      enabled: false
    kafka:
      enabled: false
    redis:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

data-engine:
  base-url: ${DATA_ENGINE_URL:http://localhost:8000}
  api-key: ${DATA_ENGINE_API_KEY:}