# ==============================================================================
# LUMINAI PRODUCTION OVERRIDES (AWS UNIFIED LIGHTSAIL)
# ==============================================================================
services:
  postgres:
    ports: []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luminai}
      POSTGRES_USER: ${POSTGRES_USER:-luminai_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.75"

  neo4j:
    image: neo4j:5-community
    container_name: luminai-neo4j
    restart: unless-stopped
    ports: []
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.5"

  keycloak:
    command: ["start", "--import-realm"]
    ports: []
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-luminai}
      KC_DB_USERNAME: ${POSTGRES_USER:-luminai_admin}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      KC_HTTP_PORT: 8180
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HOSTNAME: "auth.${DOMAIN_NAME}"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "true"
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.75"

  redis:
    ports: []
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  zookeeper:
    ports: []
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  kafka:
    ports: []
    environment:
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  core-backend:
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:+UseContainerSupport -Xms256m -Xmx512m -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-luminai}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-luminai_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-luminai}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-luminai_admin}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_SSL_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Neo4j Knowledge Graph parameters
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      # Keycloak OIDC Authentication & Admin REST
      KEYCLOAK_ISSUER_URI: https://auth.${DOMAIN_NAME}/realms/${KEYCLOAK_REALM:-luminai}
      KEYCLOAK_JWK_SET_URI: https://auth.${DOMAIN_NAME}/realms/${KEYCLOAK_REALM:-luminai}/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8180
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-luminai}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-luminai-admin-cli}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:?VAULT_ENCRYPTION_KEY must be set in .env}
      DATA_ENGINE_URL: http://data-engine:8000
      DATA_ENGINE_API_KEY: ${DATA_ENGINE_API_KEY:?DATA_ENGINE_API_KEY must be set in .env}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
      MINIO_BUCKET: ${MINIO_BUCKET_RAW:-luminai-raw}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://luminai.${DOMAIN_NAME},https://app.${DOMAIN_NAME}}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q 'UP' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1024m
          cpus: "1.0"

  data-engine:
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - data_engine_storage:/app/storage
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-luminai_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-luminai}
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-luminai-raw}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      APP_FRONTEND_URL: https://luminai.${DOMAIN_NAME}
      API_KEY: ${DATA_ENGINE_API_KEY:?DATA_ENGINE_API_KEY must be set in .env}
      KEYCLOAK_URL: http://keycloak:8180
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-https://auth.${DOMAIN_NAME}/realms/${KEYCLOAK_REALM:-luminai}}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-luminai}
      AI_INSIGHTS_PROVIDER: ${AI_INSIGHTS_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    deploy:
      resources:
        limits:
          memory: 1024m
          cpus: "0.75"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api.${DOMAIN_NAME}
        VITE_AUTH_URL: https://auth.${DOMAIN_NAME}/realms/${KEYCLOAK_REALM:-luminai}
        VITE_AUTH_CLIENT_ID: luminai-spa
    ports:
      - "127.0.0.1:3000:80"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

  # ---------------------------------------------------------------------------
  # Disable RAM-heavy non-production services from base compose
  # ---------------------------------------------------------------------------
  opensearch:
    profiles: ["disabled"]
    deploy:
      replicas: 0

  dagster-webserver:
    profiles: ["disabled"]
    deploy:
      replicas: 0

  dagster-daemon:
    profiles: ["disabled"]
    deploy:
      replicas: 0

volumes:
  data_engine_storage:
