<svg width="170" height="38" viewBox="0 0 170 38" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .wordmark {
      fill: #09090b;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.035em;
    }
    @media (prefers-color-scheme: dark) {
      .wordmark {
        fill: #f4f4f5;
      }
    }
  </style>

  <!-- Prism Mark: represents multi-source unified data & luminous entity nodes -->
  <g id="mark">
    <!-- Top Face (lighter blue) -->
    <path d="M19 3L32 10.5L19 18L6 10.5L19 3Z" fill="#3B82F6"/>
    <!-- Left Face (deep royal) -->
    <path d="M6 10.5L19 18V33L6 25.5V10.5Z" fill="#1D4ED8"/>
    <!-- Right Face (vibrant cobalt) -->
    <path d="M19 18L32 10.5V25.5L19 33V18Z" fill="#2563EB"/>
    
    <!-- Radiating interior light paths -->
    <path d="M19 18V6" stroke="#93C5FD" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M19 18L8.5 24" stroke="#93C5FD" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M19 18L29.5 24" stroke="#93C5FD" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Central illuminated node -->
    <circle cx="19" cy="18" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="44" y="25.5" class="wordmark">LuminAI</text>
</svg>
