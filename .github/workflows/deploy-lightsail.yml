name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Lightsail & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          command_timeout: 30m
          timeout: 60s
          script: |
            set -e
            echo "🚀 Starting automated deployment on Lightsail..."
            cd /home/ubuntu/LuminAI
            
            echo "📥 Pulling latest changes from main branch..."
            git checkout -- docker-compose.yml docker-compose.prod.yml
            git pull origin main
            
            echo "⚡ Enabling BuildKit for fast cached builds..."
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            
            echo "🔨 Building updated application containers..."
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml build
            
            echo "🔄 Bringing up updated services..."
            docker rm -f luminai-data-engine luminai-core-backend luminai-frontend 2>/dev/null || true
            docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            
            echo "✅ Deployment successful! Active containers:"
            docker-compose ps


