name: Deploy Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Core Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./core-backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/core-backend:latest
            ghcr.io/${{ github.repository }}/core-backend:sha-${{ github.sha }}

      - name: Build & Push Data Engine Image
        uses: docker/build-push-action@v5
        with:
          context: ./data-engine
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/data-engine:latest
            ghcr.io/${{ github.repository }}/data-engine:sha-${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:sha-${{ github.sha }}

  argocd-sync:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ArgoCD Staging Sync
        run: |
          echo "Initiating ArgoCD deployment sync for staging environment..."
          if [ -n "${{ secrets.ARGO_SERVER }}" ] && [ -n "${{ secrets.ARGO_AUTH_TOKEN }}" ]; then
            curl -k -sS -X POST -H "Authorization: Bearer ${{ secrets.ARGO_AUTH_TOKEN }}" \
              "https://${{ secrets.ARGO_SERVER }}/api/v1/applications/luminai-staging/sync"
            echo "ArgoCD sync command dispatched successfully."
          else
            echo "ArgoCD credentials not configured in secrets; staging image push succeeded."
          fi
